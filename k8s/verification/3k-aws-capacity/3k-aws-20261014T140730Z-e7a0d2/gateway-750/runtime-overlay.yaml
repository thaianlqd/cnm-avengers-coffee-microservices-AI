        app.kubernetes.io/component: backend
        app.kubernetes.io/name: menu-service
        app.kubernetes.io/part-of: avengers-coffee
    spec:
      containers:
      - env:
        - name: PORT
          value: "3003"
        envFrom:
        - configMapRef:
            name: avengers-common
        - configMapRef:
            name: menu-service-config
        - secretRef:
            name: menu-service-secrets
        image: avengers/menu-service:3k-aws-dd98fd5a93a3
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        name: menu-service
        ports:
        - containerPort: 3003
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
