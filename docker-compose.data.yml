services:
  # =========================================
  # ANALYTICS DATABASE — PostgreSQL riêng cho Data Platform
  # =========================================
  postgres-analytics:
    image: postgres:16
    container_name: avengers_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics123
      POSTGRES_DB: analytics
    ports:
      - "5434:5432"
    volumes:
      - avengers_analytics_data:/var/lib/postgresql/data
      - ./data-platform/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network
  # =========================================
  # DATA SYNC — ETL từ Supabase → postgres-analytics
  # Tự động phát hiện và sync TOÀN BỘ bảng
  # =========================================
  data-sync:
    build:
      context: ./data-platform
      dockerfile: data-sync/Dockerfile
    container_name: avengers_data_sync
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 384m
    depends_on:
      postgres-analytics:
        condition: service_healthy
    environment:
      # Source: Supabase (production)
      SOURCE_DB_HOST: ${DB_HOST:-aws-0-ap-southeast-1.pooler.supabase.com}
      SOURCE_DB_PORT: ${DB_PORT:-6543}
      SOURCE_DB_USER: ${DB_USER:-postgres.seneuycwihbyqjdtcdvu}
      SOURCE_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD; rotate any previously committed source credential}
      SOURCE_DB_NAME: ${DB_NAME:-postgres}
      SOURCE_DB_SSLMODE: ${PGSSLMODE:-require}
      # Target: postgres-analytics (local)
      TARGET_DB_HOST: postgres-analytics
      TARGET_DB_PORT: 5432
      TARGET_DB_USER: analytics
      TARGET_DB_PASSWORD: analytics123
      TARGET_DB_NAME: analytics
      # Sync config
      DATA_PLATFORM_GOVERNED_INGESTION: ${DATA_PLATFORM_GOVERNED_INGESTION:-1}
      DATA_PLATFORM_WAREHOUSE_PROFILE_PATH: /run/secrets/warehouse-replica.json
      SYNC_INTERVAL_SECONDS: 300
      SYNC_SCHEMAS: "orders,identity,menu,inventory,news,ai"
    volumes:
      - ./data-platform/analytics-api/.runtime/replica-secrets:/run/secrets:ro
    networks:
      - data-network
  # =========================================
  # EVENT STREAMING — Zookeeper + Kafka (Confluent, stable)
  # =========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    platform: linux/amd64
    container_name: avengers_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - avengers_zk_data:/var/lib/zookeeper/data
      - avengers_zk_log:/var/lib/zookeeper/log
    networks:
      - data-network
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    platform: linux/amd64
    container_name: avengers_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      # Giới hạn heap JVM Kafka: tiết kiệm RAM tối đa
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - avengers_kafka_data:/var/lib/kafka/data
    networks:
      - data-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
  # Kafka Web UI — tắt profile để tiết kiệm tài nguyên
  # Bật khi cần: docker compose -f docker-compose.data.yml --profile tools up -d kafka-ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: avengers_kafka_ui
    restart: "no"
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: avengers-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8082:8080"
    networks:
      - data-network
  # =========================================
  # DATA LAKE — MinIO (S3-compatible)
  # Cross-platform: build local image for host architecture
  # (arm64 on Apple Silicon, amd64 on Windows/Intel)
  # =========================================
  minio:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24-alpine AS builder
        RUN apk add --no-cache git ca-certificates
        ENV CGO_ENABLED=0
        RUN mkdir -p /out \
            && GOBIN=/out go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z \
            && GOBIN=/out go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z

        FROM alpine:3.20
        RUN apk add --no-cache ca-certificates curl
        COPY --from=builder /out/minio /usr/local/bin/minio
        COPY --from=builder /out/mc /usr/local/bin/mc
        RUN chmod +x /usr/local/bin/minio /usr/local/bin/mc
        EXPOSE 9000 9001
        VOLUME ["/data"]
    container_name: avengers_minio
    cpus: 0.20
    mem_limit: 768m
    restart: unless-stopped
    environment:
      GOMAXPROCS: 1
      GOMEMLIMIT: 384MiB
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command:
      - /bin/sh
      - -ec
      - |
        minio server /data --console-address ":9001" &
        MINIO_PID=$$!
        until curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; do
          sleep 1
        done
        mc alias set local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/avengers-bronze
        mc mb --ignore-existing local/avengers-silver
        mc mb --ignore-existing local/avengers-gold
        mc mb --ignore-existing local/avengers-models
        wait $$MINIO_PID
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - avengers_minio_data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # =========================================
  # EVENT PRODUCER — reads analytics DB, publishes to Kafka
  # =========================================
  kafka-producer:
    build:
      context: ./data-platform
      dockerfile: kafka-producer/Dockerfile
    container_name: avengers_kafka_producer
    cpus: 0.10
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    environment:
      DATA_PLATFORM_GOVERNED_STREAMING: ${DATA_PLATFORM_GOVERNED_STREAMING:-1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      POLL_INTERVAL_SECONDS: 60
    volumes:
      - ./data-platform/kafka-producer:/app
      - ./data-platform/analytics-api/.runtime/streaming-secrets:/run/secrets:ro
    networks:
      - data-network
  # =========================================
  # EVENT CONSUMER — reads Kafka topics, ingests to Bronze Lake & Real-time table
  # =========================================
  kafka-consumer:
    build:
      context: ./data-platform
      dockerfile: kafka-consumer/Dockerfile
    container_name: avengers_kafka_consumer
    cpus: 0.15
    mem_limit: 384m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: avengers-bronze-consumer
      DATA_PLATFORM_GOVERNED_STREAMING: ${DATA_PLATFORM_GOVERNED_STREAMING:-1}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      BATCH_SIZE: 50
      FLUSH_INTERVAL_SECONDS: 15
    volumes:
      - ./data-platform/kafka-consumer:/app
      - ./data-platform/analytics-api/.runtime/streaming-secrets:/run/secrets:ro
    networks:
      - data-network
  # =========================================
  # SPARK JOBS — Bronze → Silver → Gold (Python local mode)
  # =========================================
  spark-jobs:
    build:
      context: ./data-platform
      dockerfile: spark-jobs/Dockerfile
    container_name: avengers_spark_jobs
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      DATA_PLATFORM_GOVERNED_BATCH: ${DATA_PLATFORM_GOVERNED_BATCH:-0}
      DATA_PLATFORM_WAREHOUSE_PROFILE_PATH: /run/secrets/warehouse-batch.json
    volumes:
      - ./data-platform/spark-jobs:/opt/spark-jobs
      - ./data-platform/analytics-api/.runtime/batch-secrets:/run/secrets:ro
    networks:
      - data-network
  # =========================================
  # ORCHESTRATION — Apache Airflow (chỉ bật khi cần)
  # Bật: docker compose -f docker-compose.data.yml --profile tools up -d airflow
  # =========================================
  airflow:
    build:
      context: ./data-platform
      dockerfile: airflow/Dockerfile
    container_name: avengers_airflow
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: avengers-airflow-secret-2025
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Tối ưu RAM cho Airflow (Tránh lỗi OOM Cannot allocate memory)
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
      AIRFLOW_ADMIN_USER: admin
      AIRFLOW_ADMIN_PASSWORD: admin123
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "8083:8080"
    volumes:
      - ./data-platform/airflow/dags:/opt/airflow/dags
      - ./data-platform/spark-jobs:/opt/airflow/spark-jobs
      - avengers_airflow_data:/opt/airflow
    networks:
      - data-network
  # =========================================
  # REDIS — Cache & Session Store cho Data Platform
  # =========================================
  redis-analytics:
    image: redis:7-alpine
    container_name: avengers_analytics_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - avengers_analytics_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data-network

  # =========================================
  # ANALYTICS BACKEND & AI SERVICE (FastAPI)
  # =========================================
  analytics-api:
    build:
      context: ./data-platform
      dockerfile: analytics-api/Dockerfile
    container_name: avengers_analytics_api
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 1024m
    depends_on:
      postgres-analytics:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis-analytics:
        condition: service_healthy
    env_file:
      - ./data-platform/.env
    environment:
      ANALYTICS_INITIALIZE_WAREHOUSE_ON_STARTUP: "false"
      DATA_ANALYST_ALLOWED_ORIGINS: ${DATA_ANALYST_ALLOWED_ORIGINS:-}
      PORT: 8000
      PYTHONPATH: /app:/opt/pipeline-common
      # ── Database (Analytics DB riêng) ──────────────────
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      # ── MinIO / Kafka ─────────────────────────────────
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # ── AI Analytics ──────────────────────────────────
      # V2.8 semantic interpretation + bounded targeted recovery, normal = 1.
      DATA_ANALYST_MAX_PROVIDER_CALLS_PER_TURN: "3"
      DATA_ANALYST_ONE_CLICK_ENABLED: ${DATA_ANALYST_ONE_CLICK_ENABLED:-1}
      DATA_ANALYST_ENABLE_CONTRACT_REPAIR: "1"
      DATA_ANALYST_ENABLE_MODEL_ESCALATION: "0"
      DATA_ANALYST_ENABLE_PROVIDER_FALLBACK: "0"
      # V3.2 bounded CREDENTIAL failover (same model, ≤1 extra HTTP attempt per
      # logical call). Defaults to the already-managed Chatbot Gemini secret from
      # the root .env; set DATA_ANALYST_GEMINI_SECONDARY_KEY= (empty) to disable.
      DATA_ANALYST_GEMINI_SECONDARY_KEY: ${DATA_ANALYST_GEMINI_SECONDARY_KEY-${GEMINI_API_KEY:-}}
      DATA_ANALYST_ENABLE_POST_RESULT_SYNTHESIS: "0"
      DATA_ANALYST_RECOVERY_MODEL: ${DATA_ANALYST_RECOVERY_MODEL:-}
      DATA_ANALYST_INTENT_TRANSPORT: ${DATA_ANALYST_INTENT_TRANSPORT:-json}
      DATA_ANALYST_PROVIDER_READ_TIMEOUT_SECONDS: ${DATA_ANALYST_PROVIDER_READ_TIMEOUT_SECONDS:-60}
      DATA_ANALYST_ENV: production
      DATA_ANALYST_SESSION_STORE: redis
      DATA_ANALYST_ARTIFACT_STORE: redis
      DATA_ANALYST_CAPACITY_EXECUTION_ROWS: "50000"
      DATA_ANALYST_CAPACITY_CHART_POINTS: "500"
      DATA_ANALYST_CAPACITY_RESPONSE_BYTES: "1000000"
      DATA_ANALYST_CAPACITY_SESSION_BYTES: "1000000"
      DATA_ANALYST_REDIS_URL: ${DATA_ANALYST_REDIS_URL:-redis://redis-analytics:6379/2}
      # Explicit disabled/trusted_admin overrides public deployment settings.
      # The default delegates to the reviewed settings file, otherwise disabled.
      DATA_ANALYST_REPORT_SQL_MODE: ${DATA_ANALYST_REPORT_SQL_MODE:-deployment}
      DATA_ANALYST_REPORT_ADMIN_TOKEN: ${DATA_ANALYST_REPORT_ADMIN_TOKEN:-}
      # Optional source access is metadata-only; analytical SQL always uses postgres-analytics.
      SOURCE_DB_HOST: ${DB_HOST:-aws-0-ap-southeast-1.pooler.supabase.com}
      SOURCE_DB_PORT: ${DB_PORT:-6543}
      SOURCE_DB_USER: ${DB_USER:-postgres.seneuycwihbyqjdtcdvu}
      SOURCE_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD; rotate any previously committed source credential}
      SOURCE_DB_NAME: ${DB_NAME:-postgres}
      SOURCE_DB_SSLMODE: ${PGSSLMODE:-require}
    ports:
      - "8502:8000"
    volumes:
      - ./data-platform/analytics-api:/app
      - ./data-platform/pipeline-common:/opt/pipeline-common:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 7 http://localhost:8000/api/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s
    networks:
      - data-network

  web-ui:
    build:
      context: ./data-platform/web-ui
    container_name: avengers_analytics_web
    restart: unless-stopped
    depends_on:
      analytics-api:
        condition: service_healthy
    ports:
      - "8501:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data-network
volumes:
  avengers_analytics_data:
  avengers_zk_data:
  avengers_zk_log:
  avengers_kafka_data:
  avengers_minio_data:
  avengers_airflow_data:
  avengers_analytics_redis_data:
networks:
  data-network:
    driver: bridge
