services:
  # =========================================
  # ANALYTICS DATABASE — PostgreSQL riêng cho Data Platform
  # =========================================
  postgres-analytics:
    image: pgvector/pgvector:pg16
    container_name: avengers_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics123
      POSTGRES_DB: analytics
    ports:
      - "5434:5432"
    volumes:
      - avengers_analytics_data:/var/lib/postgresql/data
      - ./data-platform/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  # =========================================
  # DATA SYNC — ETL từ Supabase → postgres-analytics
  # Tự động phát hiện và sync TOÀN BỘ bảng
  # =========================================
  data-sync:
    build:
      context: ./data-platform/data-sync
    container_name: avengers_data_sync
    restart: unless-stopped
    depends_on:
      postgres-analytics:
        condition: service_healthy
    environment:
      # Source: Supabase (production)
      SOURCE_DB_HOST: ${DB_HOST:-aws-0-ap-southeast-1.pooler.supabase.com}
      SOURCE_DB_PORT: ${DB_PORT:-6543}
      SOURCE_DB_USER: ${DB_USER:-postgres.seneuycwihbyqjdtcdvu}
      SOURCE_DB_PASSWORD: ${DB_PASSWORD:-afSMTJmSkNwOEmAT}
      SOURCE_DB_NAME: ${DB_NAME:-postgres}
      SOURCE_DB_SSLMODE: ${PGSSLMODE:-require}
      # Target: postgres-analytics (local)
      TARGET_DB_HOST: postgres-analytics
      TARGET_DB_PORT: 5432
      TARGET_DB_USER: analytics
      TARGET_DB_PASSWORD: analytics123
      TARGET_DB_NAME: analytics
      # Sync config
      SYNC_INTERVAL_SECONDS: 300
      SYNC_SCHEMAS: "orders,identity,menu,inventory,news,ai"
    networks:
      - data-network

  # =========================================
  # EVENT STREAMING — Zookeeper + Kafka (Confluent, stable)
  # =========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: avengers_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - avengers_zk_data:/var/lib/zookeeper/data
      - avengers_zk_log:/var/lib/zookeeper/log
    networks:
      - data-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: avengers_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      # Giới hạn heap JVM Kafka: tiết kiệm RAM tối đa
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - avengers_kafka_data:/var/lib/kafka/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Kafka Web UI — tắt profile để tiết kiệm tài nguyên
  # Bật khi cần: docker compose -f docker-compose.data.yml --profile tools up -d kafka-ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: avengers_kafka_ui
    restart: "no"
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: avengers-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8082:8080"
    networks:
      - data-network

  # =========================================
  # DATA LAKE — MinIO (S3-compatible)
  # =========================================
  minio:
    image: minio/minio:latest
    container_name: avengers_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - avengers_minio_data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: avengers_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb --ignore-existing myminio/avengers-bronze;
      /usr/bin/mc mb --ignore-existing myminio/avengers-silver;
      /usr/bin/mc mb --ignore-existing myminio/avengers-gold;
      /usr/bin/mc mb --ignore-existing myminio/avengers-models;
      echo '=== MinIO buckets created: Bronze / Silver / Gold / Models ===';
      "
    networks:
      - data-network

  # =========================================
  # EVENT PRODUCER — reads analytics DB, publishes to Kafka
  # =========================================
  kafka-producer:
    build:
      context: ./data-platform/kafka-producer
    container_name: avengers_kafka_producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      POLL_INTERVAL_SECONDS: 60
    volumes:
      - ./data-platform/kafka-producer:/app
    networks:
      - data-network

  # =========================================
  # EVENT CONSUMER — reads Kafka topics, ingests to Bronze Lake & Real-time table
  # =========================================
  kafka-consumer:
    build:
      context: ./data-platform/kafka-consumer
    container_name: avengers_kafka_consumer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: avengers-bronze-consumer
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      BATCH_SIZE: 50
      FLUSH_INTERVAL_SECONDS: 15
    volumes:
      - ./data-platform/kafka-consumer:/app
    networks:
      - data-network

  # =========================================
  # SPARK JOBS — Bronze → Silver → Gold (Python local mode)
  # =========================================
  spark-jobs:
    build:
      context: ./data-platform/spark-jobs
    container_name: avengers_spark_jobs
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
    volumes:
      - ./data-platform/spark-jobs:/opt/spark-jobs
    networks:
      - data-network

  # =========================================
  # ORCHESTRATION — Apache Airflow (chỉ bật khi cần)
  # Bật: docker compose -f docker-compose.data.yml --profile tools up -d airflow
  # =========================================
  airflow:
    build:
      context: ./data-platform/airflow
    container_name: avengers_airflow
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: avengers-airflow-secret-2025
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Tối ưu RAM cho Airflow (Tránh lỗi OOM Cannot allocate memory)
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
      AIRFLOW_ADMIN_USER: admin
      AIRFLOW_ADMIN_PASSWORD: admin123
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "8083:8080"
    volumes:
      - ./data-platform/airflow/dags:/opt/airflow/dags
      - ./data-platform/spark-jobs:/opt/airflow/spark-jobs
      - avengers_airflow_data:/opt/airflow
    networks:
      - data-network

  # =========================================
  # VISUALIZATION — Modern React + FastAPI Analytics Portal
  # =========================================
  web-ui:
    build:
      context: ./data-platform/web-ui
    container_name: avengers_analytics_web
    restart: unless-stopped
    depends_on:
      postgres-analytics:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # ── Database (Analytics DB riêng) ──────────────────
      DB_HOST: postgres-analytics
      DB_PORT: 5432
      DB_USER: analytics
      DB_PASSWORD: analytics123
      DB_NAME: analytics
      DB_SSLMODE: disable
      # ── MinIO / Kafka ─────────────────────────────────
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # ── AI Analytics ──────────────────────────────────
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8501:8501"
    volumes:
      - ./data-platform/web-ui/dist:/app/dist
      - ./data-platform/web-ui/server:/app/server
    networks:
      - data-network


volumes:
  avengers_analytics_data:
  avengers_zk_data:
  avengers_zk_log:
  avengers_kafka_data:
  avengers_minio_data:
  avengers_airflow_data:

networks:
  data-network:
    driver: bridge
