apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: avengers-coffee
resources:
- ../../base
- hpa.yaml
patches:
- target:
    kind: Service
    name: api-gateway
  patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30300
- target:
    kind: ConfigMap
    name: avengers-common
  patch: |-
    - op: add
      path: /data/K8S_DB_MODE
      value: existing
- target:
    kind: Deployment
    name: web-customer
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web-customer
- target:
    kind: Service
    name: web-customer
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: web-customer
- target:
    kind: Deployment
    name: inventory-service
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: inventory-service
- target:
    kind: Service
    name: inventory-service
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: inventory-service
- target:
    kind: Deployment
    name: order-service
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: order-service
- target:
    kind: Service
    name: order-service
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: order-service
- target:
    kind: Deployment
    name: ai-service
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ai-service
- target:
    kind: Service
    name: ai-service
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: ai-service
- target:
    kind: ConfigMap
    name: avengers-common
  patch: |-
    - op: add
      path: /data/DB_PROBE_CONNECTION_TIMEOUT_MS
      value: '2000'
