apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: &id001
    app.kubernetes.io/part-of: avengers-coffee
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: avengers-coffee
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: api-gateway
        image: avengers/api-gateway:k8s-local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 75m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        envFrom:
        - configMapRef:
            name: avengers-common
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        env:
        - name: GATEWAY_REQUEST_LOGGING
          value: 'false'
        - name: GATEWAY_PROXY_KEEP_ALIVE
          value: 'false'
        - name: GATEWAY_MAX_REQUESTS_PER_SOCKET
          value: '0'
        - name: PORT
          value: '3000'
