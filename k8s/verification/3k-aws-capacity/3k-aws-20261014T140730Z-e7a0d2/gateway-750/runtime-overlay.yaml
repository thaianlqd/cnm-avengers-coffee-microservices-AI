    app.kubernetes.io/part-of: avengers-coffee
  name: avengers-coffee
---
apiVersion: v1
data:
  AI_SERVICE_URL: http://ai-service:8000
  DB_POOL_IDLE_TIMEOUT_MS: "30000"
  DB_PROBE_CONNECTION_TIMEOUT_MS: "2000"
  ENVIRONMENT: production
  IDENTITY_SERVICE_URL: http://identity-service:3001
  INVENTORY_SERVICE_URL: http://inventory-service:3004
  K8S_DB_MODE: existing
  K8S_DEMO_READ_ONLY: "true"
  MENU_SERVICE_URL: http://menu-service:3003
  NEWS_SERVICE_URL: http://news-service:3006
  NODE_ENV: production
  ORDER_SERVICE_URL: http://order-service:3005
  PAYMENT_RETURN_BASE_URL: http://localhost:3000
  PUBLIC_BROWSE_CACHE_TTL_MS: "5000"
  SOCKET_REDIS_ENABLED: "true"
  WEB_CUSTOMER_BASE_URL: http://localhost:5175
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: configuration
    app.kubernetes.io/name: avengers-common
    app.kubernetes.io/part-of: avengers-coffee
  name: avengers-common
  namespace: avengers-coffee
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: avengers-coffee
  name: api-gateway
  namespace: avengers-coffee
spec:
  ports:
  - name: http
    nodePort: 30300
    port: 3000
    targetPort: http
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: avengers-coffee
  type: NodePort
---
