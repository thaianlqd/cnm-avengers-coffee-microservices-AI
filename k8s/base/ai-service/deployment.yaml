apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels: &id001
    app.kubernetes.io/part-of: avengers-coffee
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/part-of: avengers-coffee
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: ai-service
        image: avengers/ai-service:k8s-local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        envFrom:
        - configMapRef:
            name: avengers-common
        - configMapRef:
            name: ai-service-config
        - secretRef:
            name: ai-service-secrets
        env:
        - name: PORT
          value: '8000'
