    <linearGradient id="plane" x1="600" y1="650" x2="600" y2="1200" gradientUnits="userSpaceOnUse"><stop stop-color="#60a5fa" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa" stop-opacity=".13"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".03"/></linearGradient>
