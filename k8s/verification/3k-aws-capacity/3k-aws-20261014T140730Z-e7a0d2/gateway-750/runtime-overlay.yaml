apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: avengers-coffee
  name: api-gateway
  namespace: avengers-coffee
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: avengers-coffee
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: avengers-coffee
    spec:
      containers:
      - env:
        - name: GATEWAY_REQUEST_LOGGING
          value: "false"
        - name: GATEWAY_PROXY_KEEP_ALIVE
          value: "false"
        - name: GATEWAY_MAX_REQUESTS_PER_SOCKET
          value: "0"
        - name: PORT
          value: "3000"
        envFrom:
        - configMapRef:
            name: avengers-common
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        image: avengers/api-gateway:3k-aws-dd98fd5a93a3
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        name: api-gateway
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 4
        resources:
          limits:
            cpu: 750m
            memory: 256Mi
          requests:
            cpu: 75m
            memory: 128Mi
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
      terminationGracePeriodSeconds: 30
---
