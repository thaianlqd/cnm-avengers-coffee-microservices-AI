apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: avengers-coffee
resources:
- ../../base
- hpa.yaml
patches:
- target:
    version: v1
    kind: Service
    name: web-customer
  path: web-customer-exposure.yaml
- target:
    version: v1
    kind: Service
    name: api-gateway
  path: api-gateway-exposure.yaml
- target:
    version: v1
    kind: Service
    name: order-service
  path: order-service-exposure.yaml
