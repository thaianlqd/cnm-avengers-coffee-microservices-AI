apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-service
  labels: &id001
    app.kubernetes.io/part-of: avengers-coffee
    app.kubernetes.io/name: news-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: news-service
      app.kubernetes.io/part-of: avengers-coffee
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: news-service
        image: avengers/news-service:k8s-local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3006
        resources:
          requests:
            cpu: 75m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        envFrom:
        - configMapRef:
            name: avengers-common
        - configMapRef:
            name: news-service-config
        - secretRef:
            name: news-service-secrets
        env:
        - name: PORT
          value: '3006'
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
          readOnly: true
      volumes:
      - name: uploads
        emptyDir: {}
      initContainers:
      - name: public-media
        image: avengers/customer-media:k8s-local
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - cp -a /media/uploads/. /target/
        volumeMounts:
        - name: uploads
          mountPath: /target
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
