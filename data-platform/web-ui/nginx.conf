server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend API service
    location /api/ {
        # Docker may assign a new IP when analytics-api is recreated.
        # Resolve at request time instead of pinning its startup address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $analytics_backend analytics-api:8000;
        proxy_pass http://$analytics_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
