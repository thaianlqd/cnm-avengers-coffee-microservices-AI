apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app.kubernetes.io/part-of: avengers-coffee
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: avengers-coffee
  ports:
  - name: http
    port: 3005
    targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
