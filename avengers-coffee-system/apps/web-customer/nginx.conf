server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health/live {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /health/ready {
    access_log off;
    try_files /index.html =503;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
