apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: &id001
    app.kubernetes.io/part-of: avengers-coffee
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
      app.kubernetes.io/part-of: avengers-coffee
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: order-service
        image: avengers/order-service:k8s-local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3005
        resources:
          requests:
            cpu: 125m
            memory: 192Mi
          limits:
            cpu: 700m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        envFrom:
        - configMapRef:
            name: avengers-common
        - configMapRef:
            name: order-service-config
        - secretRef:
            name: order-service-secrets
        env:
        - name: PORT
          value: '3005'
