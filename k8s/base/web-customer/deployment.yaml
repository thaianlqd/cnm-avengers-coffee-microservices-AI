apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-customer
  labels: &id001
    app.kubernetes.io/part-of: avengers-coffee
    app.kubernetes.io/name: web-customer
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-customer
      app.kubernetes.io/part-of: avengers-coffee
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: web-customer
        image: avengers/web-customer:k8s-local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
